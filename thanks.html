<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ご注文ありがとうございます｜SUMI MATCHA</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--sumi:#1c1b19;--rule:#3d3b36;--mist:#9b968c;--paper:#ece9e3;--matcha:#86a04f;--gutter:clamp(20px,5vw,72px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--sumi);color:var(--paper);font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;line-height:1.9;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--matcha);outline-offset:3px}
header{padding:22px var(--gutter)}
.mark{font-family:"Shippori Mincho",serif;font-size:15px;letter-spacing:.32em;text-decoration:none}
main{padding:clamp(48px,8vw,104px) var(--gutter);max-width:880px}
h1{font-family:"Shippori Mincho",serif;font-weight:400;font-size:clamp(26px,3.4vw,40px);line-height:1.45;margin-bottom:24px}
p{color:#cfccc5;max-width:34em}
dl{margin-top:40px;border-top:1px solid var(--rule)}
dl div{display:grid;grid-template-columns:12em 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--rule);font-size:15px}
dt{color:var(--mist)}
.todo{color:#e2b45c}
.back{display:inline-block;margin-top:40px;font-size:15px;padding:14px 26px;border:1px solid var(--paper);text-decoration:none}
footer{padding:32px var(--gutter);font-size:13px;color:var(--mist)}
@media (max-width:600px){dl div{grid-template-columns:1fr;gap:4px}}
</style>
<style>[data-en]{display:none}html[lang=en] [data-ja]{display:none}html[lang=en] [data-en]{display:revert}</style>
</head>
<body>
<header><a class="mark" href="./">SUMI MATCHA</a></header>
<main>
  <h1><span data-ja>ご注文ありがとうございます。</span><span data-en>Thank you for your order.</span></h1>
  <p><span data-ja>ご注文を受け付けました。ご入力いただいたメールアドレスに、注文内容の確認メールをお送りしています。発送の準備ができ次第、あらためてご連絡します。</span><span data-en>We've received your order and sent a receipt to your email. We'll be in touch again when it ships.</span></p>
  <a class="back" href="./"><span data-ja>トップに戻る</span><span data-en>Back to home</span></a>
</main>
<footer>© 2026 JourneyMate Inc.</footer>
<script>
(function(){let l=null;try{l=localStorage.getItem('lang')}catch(e){}
if(!l)l=(navigator.language||'ja').toLowerCase().startsWith('ja')?'ja':'en';document.documentElement.lang=l})();
</script>
</body>
</html>
